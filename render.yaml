services:
  - type: web
    name: ascent-backend-api
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && npm run seed && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
