<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Ascent - Intentional Personal Goal & Routine Tracking">
  <title>Ascent — Intentional Goals & Routines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#8B5CF6">
  <link rel="stylesheet" href="/src/styles/theme.css">
</head>
<body class="dark-theme">
  <div id="app" class="mobile-viewport-container">
    <!-- Top Notch / Status Area -->
    <header class="app-status-bar"></header>

    <!-- Main Dynamic Screen Content -->
    <main id="main-content" class="screen-content-wrapper">
      <div class="loading-spinner-container">
        <div class="pulse-ring"></div>
        <p class="loading-label">Loading Ascent...</p>
      </div>
    </main>

    <!-- Fixed Floating Action Button (Always over screen, never scrolls) -->
    <button class="fab-btn" id="global-fab-btn" title="Create New Goal">
      <span style="font-size: 18px; line-height: 1; font-weight: 700;">+</span>
      <span>New Goal</span>
    </button>

    <!-- Floating Bottom Navigation Bar -->
    <nav id="bottom-nav" class="bottom-navigation-bar">
      <button class="nav-tab active" data-tab="today" id="tab-today">
        <div class="nav-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
        </div>
        <span class="nav-label">Today</span>
      </button>

      <button class="nav-tab" data-tab="goals" id="tab-goals">
        <div class="nav-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
        </div>
        <span class="nav-label">Goals</span>
      </button>

      <button class="nav-tab" data-tab="calendar" id="tab-calendar">
        <div class="nav-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </div>
        <span class="nav-label">Calendar</span>
      </button>

      <button class="nav-tab" data-tab="progress" id="tab-progress">
        <div class="nav-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        </div>
        <span class="nav-label">Progress</span>
      </button>

      <button class="nav-tab" data-tab="profile" id="tab-profile">
        <div class="nav-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <span class="nav-label">Profile</span>
      </button>
    </nav>

    <!-- Modal Container for Goal/Milestone/Action Modals -->
    <div id="modal-container" class="modal-overlay hidden">
      <div id="modal-content" class="modal-sheet"></div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast-notification hidden"></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
