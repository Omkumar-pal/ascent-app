version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ascent_postgres
    environment:
      POSTGRES_USER: ascent_user
      POSTGRES_PASSWORD: ascent_secure_password_2026
      POSTGRES_DB: ascent_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ascent_api
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://ascent_user:ascent_secure_password_2026@postgres:5432/ascent_db?schema=public"
      JWT_SECRET: "ascent_prod_super_secret_jwt_key_2026"
      JWT_EXPIRES_IN: "30d"
      NODE_ENV: "production"
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pgdata:
